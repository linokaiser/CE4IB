<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
<title id="title">Winterthur campus-inspired teaching pavilion</title>
<desc id="desc">North is up. A nine by six metre reference plan contains a six by six metre student project room to the west and a three by six metre office to the east. A shared wall and an internal door connect them. Two two-by-one-point-five metre windows face south in the project room. One one-point-five-by-one-point-two metre window faces north in the office. An exterior door opens into the north side of the project room.</desc>
